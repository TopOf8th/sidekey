name: Build Sidekey for Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Build Windows EXE
        working-directory: server
        shell: cmd
        run: |
          call build_exe.bat < NUL
          if not exist dist\SidekeyServer.exe exit /b 1

      - uses: actions/upload-artifact@v4
        with:
          name: SidekeyServer-Windows-x64
          path: server/dist/SidekeyServer.exe
          if-no-files-found: error
