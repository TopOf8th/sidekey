name: Build Sidekey for Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: x64

      - name: Install build dependencies
        working-directory: server
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build Windows EXE
        working-directory: server
        run: python -m PyInstaller --noconfirm SidekeyServer.spec

      - name: Verify Windows EXE
        working-directory: server
        run: |
          if (-not (Test-Path dist/SidekeyServer.exe)) {
            throw "SidekeyServer.exe was not generated"
          }

      - uses: actions/upload-artifact@v6
        with:
          name: SidekeyServer-Windows-x64
          path: server/dist/SidekeyServer.exe
          if-no-files-found: error
